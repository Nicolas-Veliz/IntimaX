name: CI/CD Cypress Tests - IntimaX

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js (Versión 22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Instalar dependencias (Raíz, Backend y Frontend)
        run: |
          npm install
          npm --prefix backend install
          npm --prefix frontend install

      - name: 4. Crear archivo cypress.env.json dinámicamente para CI
        run: |
          echo '{
            "username": "${{ secrets.CYPRESS_USERNAME }}",
            "password": "${{ secrets.CYPRESS_PASSWORD }}"
          }' > cypress.env.json

      - name: 5. Ejecutar Backend en segundo plano de forma persistente
        run: |
          nohup npm --prefix backend run dev > backend.log 2>&1 &

      - name: 6. Ejecutar Pruebas E2E con Cypress (Levantando Frontend)
        uses: cypress-io/github-action@v6
        with:
          start: npm --prefix frontend run dev
          wait-on: 'http://localhost:5173'
          wait-on-timeout: 180
          browser: electron